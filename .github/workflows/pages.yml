name: Publish the site and the spikes

# Publishes to GitHub Pages:
#
#   /                        landing page
#   /video/                  video demo (MP4, single and dual)
#   /live/                   live demo
#   /playlist/               playlist demo (three lectures in a row)
#   /bench/                  core test bench
#   /manifest/               manifest reference, with a complete example
#   /analytics/              how analytics and xAPI send data
#   /demo/                   redirects from the old addresses
#   /spikes/s1-dual-sync/    dual-stream sync spike
#   /spikes/s6-chaining/     intro and outro chaining spike
#   /probe/                  device diagnostic probe (S2)
#
# Media is NOT versioned: it is generated here with ffmpeg, in a lighter
# version than local work (hence SIZE and CRF).
#
# Needs a PUBLIC repository on the free plan: Pages from a private repo is paid.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'spikes/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Do NOT cancel in progress: a half-cancelled publish leaves Pages with a hung
  # deployment and the next one times out ("Timeout reached, aborting!", b7ad27f).
  cancel-in-progress: false

env:
  # Light media for publishing; locally each gen-media.sh uses higher quality.
  SIZE: 960x540
  CRF: '32'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # fonts-dejavu-core provides the font of the burned-in timecode.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare the site
        run: mkdir -p _site

      # --- S2: diagnostic probe -------------------------------------------
      - name: Build the diagnostic probe
        working-directory: spikes/s2-device-matrix
        run: |
          ./gen-media.sh
          node build.mjs
          mkdir -p "$GITHUB_WORKSPACE/_site/probe"
          cp dist/nanoplayer-probe.html "$GITHUB_WORKSPACE/_site/probe/index.html"

      # --- S1: sync bench -------------------------------------------------
      - name: Prepare the sync spike
        working-directory: spikes/s1-dual-sync
        env:
          DUR: '40'
        run: |
          ./gen-media.sh
          dest="$GITHUB_WORKSPACE/_site/spikes/s1-dual-sync"
          mkdir -p "$dest"
          cp index.html sync.js "$dest/"
          cp -r media "$dest/"

      # --- S6: intro and outro chaining -----------------------------------
      # Published so it can be opened on a phone: its iOS questions are only
      # answered on an iPhone.
      - name: Prepare the chaining spike
        working-directory: spikes/s6-chaining
        env:
          DUR_MAIN: '20'
        run: |
          ./gen-media.sh
          dest="$GITHUB_WORKSPACE/_site/spikes/s6-chaining"
          mkdir -p "$dest"
          cp index.html chain.js "$dest/"
          cp -r media "$dest/"

      # --- site ------------------------------------------------------------
      # The site takes the root. The demo's old addresses redirect so shared
      # links keep working.
      - name: Build the site
        working-directory: demo
        env:
          DUR: '40'
        run: |
          ./gen-media.sh
          pnpm build
          cp -r dist/. "$GITHUB_WORKSPACE/_site/"
          redirect() {
            mkdir -p "$(dirname "$GITHUB_WORKSPACE/_site/$1")"
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="%s"><a href="%s">Moved</a>\n' "$2" "$2" "$2" \
              > "$GITHUB_WORKSPACE/_site/$1"
          }
          redirect demo/index.html ../video/
          redirect demo/banco.html ../bench/

      - name: Site size
        run: du -sh _site && du -sh _site/*

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Above the default 10 minutes: the site is about 8 MB of test videos.
          timeout: 900000
