name: Publicar la web y los spikes

# Publica en GitHub Pages la web del proyecto y los spikes:
#
#   /                        portada: qué es, por qué y casos de uso
#   /video/                  demo de vídeo (MP4, mono y dual)
#   /live/                   demo de directo (sin directo enlazado todavía)
#   /bench/                  banco de pruebas del núcleo
#   /demo/                   redirecciones desde las direcciones antiguas
#   /spikes/s1-dual-sync/    spike de sincronización dual-stream
#   /spikes/s6-chaining/     spike de encadenado de cabecera y cola
#   /probe/                  sonda de diagnóstico de dispositivo (S2)
#
# Los medios NO se versionan: se generan aquí con ffmpeg. Con la calidad de
# trabajo local pesarían unos 40 MB, así que para publicar se usa una versión
# reducida — de ahí SIZE y CRF.
#
# Requiere repositorio PÚBLICO en plan gratuito: Pages desde repo privado es de
# planes de pago.

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'spikes/**'
      - 'packages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # NO cancelar en curso. Es lo contrario de lo que conviene en el resto de
  # workflows, y aquí es deliberado: cancelar una publicación a medias deja el
  # servicio de Pages con un despliegue colgado, y el siguiente expira con
  # "Timeout reached, aborting!". Pasó de verdad con b7ad27f.
  cancel-in-progress: false

env:
  # Medios ligeros para publicar. En local se usan los valores por defecto de
  # cada gen-media.sh, que son de más calidad.
  SIZE: 960x540
  CRF: '32'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # fonts-dejavu-core aporta la tipografía del timecode incrustado.
      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Preparar el sitio
        run: mkdir -p _site

      # --- S2: sonda de diagnóstico ---------------------------------------
      - name: Construir la sonda de diagnóstico
        working-directory: spikes/s2-device-matrix
        run: |
          ./gen-media.sh
          node build.mjs
          mkdir -p "$GITHUB_WORKSPACE/_site/probe"
          cp dist/nanoplayer-probe.html "$GITHUB_WORKSPACE/_site/probe/index.html"

      # --- S1: banco de sincronización ------------------------------------
      - name: Preparar el spike de sincronización
        working-directory: spikes/s1-dual-sync
        env:
          DUR: '40'
        run: |
          ./gen-media.sh
          dest="$GITHUB_WORKSPACE/_site/spikes/s1-dual-sync"
          mkdir -p "$dest"
          cp index.html sync.js "$dest/"
          cp -r media "$dest/"

      # --- S6: encadenado de cabecera y cola --------------------------------
      # Se publica sobre todo para poder abrirlo en un móvil: la pregunta que
      # le queda abierta —si iOS deja arrancar el segundo elemento— solo se
      # contesta en un iPhone, y pedir que levanten un servidor en su red local
      # es pedir demasiado.
      - name: Preparar el spike de encadenado
        working-directory: spikes/s6-chaining
        env:
          DUR_MAIN: '20'
        run: |
          ./gen-media.sh
          dest="$GITHUB_WORKSPACE/_site/spikes/s6-chaining"
          mkdir -p "$dest"
          cp index.html chain.js "$dest/"
          cp -r media "$dest/"

      # --- web -------------------------------------------------------------
      # La web ocupa la raíz. Las direcciones antiguas de la demo se
      # redirigen para no romper los enlaces que ya se han compartido.
      - name: Construir la web
        working-directory: demo
        env:
          DUR: '40'
        run: |
          ./gen-media.sh
          pnpm build
          cp -r dist/. "$GITHUB_WORKSPACE/_site/"
          redirigir() {
            mkdir -p "$(dirname "$GITHUB_WORKSPACE/_site/$1")"
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=%s"><link rel="canonical" href="%s"><a href="%s">Moved</a>\n' "$2" "$2" "$2" \
              > "$GITHUB_WORKSPACE/_site/$1"
          }
          redirigir demo/index.html ../video/
          redirigir demo/banco.html ../bench/

      - name: Tamaño del sitio
        run: du -sh _site && du -sh _site/*

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Por encima de los 10 minutos por defecto: el sitio ronda los 8 MB
          # entre vídeos de prueba, y con la red de GitHub lenta se acercaba.
          timeout: 900000
