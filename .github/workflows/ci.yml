name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit tests and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      # Unit tests and the demo run against source; this checks what is published.
      # Plugins once bundled their own core copy and silently stopped registering.
      - run: pnpm build
      - run: node dist.mjs
        working-directory: e2e

  # Blocks the merge if accessibility regresses.
  e2e:
    # Required check: the project promises verifiable accessibility, so a change
    # that breaks it must not merge.
    name: Accessibility and end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - run: pnpm install --frozen-lockfile

      # Google Chrome, because Playwright's Chromium may lack H.264 and the video
      # would not decode. WebKit is Safari's and iOS's engine and does not tab to
      # buttons by default (docs/browser-quirks.md#webkit-tab).
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chrome chromium webkit
        working-directory: e2e

      - name: Generate demo media
        run: ./gen-media.sh
        working-directory: demo
        env:
          SIZE: 960x540
          CRF: '32'
          DUR: '40'

      # Audit the BUILD, served by the script itself: a background dev server
      # inside an Actions step is fragile.
      - name: Build the demo
        run: pnpm --filter @nanoplayer/demo build

      - name: Audit accessibility
        run: node a11y.mjs --serve ../demo/dist
        working-directory: e2e

      # Focus walked FROM THE DOCUMENT in two engines, not from a programmatic
      # focus(): that shortcut hid that WebKit's Tab does not enter the controls.
      - name: Keyboard walk
        run: node keyboard.mjs --serve ../demo/dist
        working-directory: e2e

      # Unit tests chain fake engines that never reject a play(): only a real
      # browser shows whether the outro survives start-up.
      - name: Intro and outro chaining
        run: node chaining.mjs --serve ../demo/dist
        working-directory: e2e

      # The full build: to emit types, tsc resolves sibling packages against their
      # `dist`. A separate step, since `pnpm build` in e2e would run e2e's script.
      - name: Build the packages
        run: pnpm build

      # Here because a browser is already installed. A `<script>` tag must give a
      # player WITH controls, which neither types nor unit tests can verify.
      - name: Check the script tag
        run: node script-tag.mjs
        working-directory: e2e

      # The two ways into an LMS: a strict CSP that forbids inline styles, and a
      # page that already loads RequireJS.
      - name: Check LMS integration
        run: node integration.mjs
        working-directory: e2e
