packages:
  - 'packages/*'
  - 'demo'
  - 'e2e'
  - 'spikes/s5-live-dual'
  - 'spikes/s6-chaining'

# pnpm 12 refuses to install until ignored build scripts are decided, so a
# clean install must not depend on answering an interactive prompt.
# esbuild's script only verifies the binary it gets through
# optionalDependencies; tests, typecheck and builds pass without running it.
allowBuilds:
  esbuild: false
